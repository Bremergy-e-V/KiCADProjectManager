[project]
name = "kicad-project-manager"
version = "0.1.0"
description = "A team project browser for KiCad projects stored in Gitea - no git knowledge required"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5",
    "keyring>=24",
]
keywords = ["kicad", "gitea", "pcb", "eda", "project-manager"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.gui-scripts]
kicad-project-manager = "kicad_project_manager.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
    "pillow>=10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_project_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]
